services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5072:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Data Source=/data/BeerListApp.db"
    volumes:
      - beer-data:/data

volumes:
  beer-data: